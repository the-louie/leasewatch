# leasewatch -- who is on the network (DHCP leases + ARP from an OPNsense firewall).
# Secrets live in .env (LW_CONNECTOR__FW1__KEY/__SECRET = a read-only OPNsense API user; MAILGUN_KEY and the switch/UniFi keys optional).
# Default: the port is published on the host (http://<host>:8080), no external network needed.
services:
  leasewatch:
    build: .
    # image: ghcr.io/the-louie/leasewatch:1.4.0  # instead of build: ., once published
    image: leasewatch:local
    container_name: leasewatch
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      TZ: UTC  # your zone (e.g. Europe/Stockholm): used for log and CSV timestamps; the UI uses the browser's zone
      # LOG_FORMAT: json  # one JSON object per log line, for a log driver that parses JSON (default: plain text)
      # LW_CONNECTORS_DIR: /connectors  # connectors that are not built in (e.g. a copy of contrib/leasewatch-dnsmasq in ./connectors)
    volumes:
      - ./data:/data
      # - ./connectors:/connectors:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

# --- Variant: behind nginx-proxy -------------------------------------------
