[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leasewatch-mdns"
version = "0.1.0"
description = "leasewatch connector: device names and models from mDNS/DNS-SD announcements heard on the LAN (listen-only)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
packages = ["leasewatch_mdns"]

[project.entry-points."leasewatch.connectors.v1"]
mdns = "leasewatch_mdns.connector:MdnsConnector"
