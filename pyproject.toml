[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "leasewatch"
dynamic = ["version"]
description = "Who is on the home network: DHCP leases and ARP from an OPNsense firewall, new devices first."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "The Louie", email = "github@louie.se" }]
keywords = ["dhcp", "arp", "opnsense", "kea", "network", "inventory", "unifi", "snmp"]
# no "License ::" classifier: the SPDX expression in `license` replaces it (setuptools>=77 rejects both)
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/the-louie/leasewatch"
Source = "https://github.com/the-louie/leasewatch"
Changelog = "https://github.com/the-louie/leasewatch/blob/main/CHANGELOG.md"
Issues = "https://github.com/the-louie/leasewatch/issues"

[project.optional-dependencies]
# same pins as requirements.txt: pysnmp for SNMPv3 to the switch, cryptography as its crypto backend
snmp = ["pysnmp>=7,<8", "cryptography"]

[project.scripts]
leasewatch = "leasewatch.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "leasewatch.__version__" }

[tool.setuptools.packages.find]
include = ["leasewatch", "leasewatch.*"]

[tool.setuptools.package-data]
leasewatch = ["static/*", "py.typed"]
"leasewatch.snmp_profiles" = ["*.json"]

[tool.ruff]
target-version = "py312"
# the code base is written in long lines: 99.4% of lines fit in 140; longer ones are left as they are (E501 off)
line-length = 140
# build/, dist/, .venv/, venv/ and friends (also inside contrib/*) are in ruff's default exclude list
extend-exclude = ["_doc"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# house style, not bugs: long lines, short `x = 1; y = 2` and `if c: return` lines, named lambdas, `l` as a name;
# B905: zip() over lists of the same length, an explicit strict= adds nothing
ignore = ["E501", "E701", "E702", "E731", "E741", "B905"]

[tool.ruff.lint.per-file-ignores]
# tests: `import os, sys` lines, one-letter stub classes, closures called within their own loop pass,
# and raising inside except on purpose to build an exception chain
"**/tests/**" = ["E401", "E742", "B023", "B904"]
